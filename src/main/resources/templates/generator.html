<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="|Generator ${generator.name}|"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
<form>
    <label>Name
        <input type="text" th:value="${generator.name}"/>
    </label>
    <br>
    <label>Count
        <input type="number" th:value="${generator.count}"/>
    </label>
    <br>
    <input type="submit" value="Update"/>
</form>
</body>
</html>
